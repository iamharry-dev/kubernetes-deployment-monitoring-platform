groups:
  - name: app.rules
    rules:
      - alert: HighRequestRate
        expr: sum(rate(app_requests_total[1m])) > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High request rate detected"
          description: "The application is receiving more than 50 requests/sec for 2 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(app_request_latency_seconds_bucket[5m])) by (le, endpoint)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.endpoint }}"
          description: "p95 latency is above 1s for 5 minutes."

      - alert: PodDown
        expr: up{job="kubernetes-pods"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape the target for more than 1 minute."
