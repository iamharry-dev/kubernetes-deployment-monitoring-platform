name: CI/CD - Build, Validate & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: k8s-monitoring-platform

jobs:
  test:
    name: Lint, Test & Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r app/requirements.txt flake8 pytest

      - name: Lint
        run: flake8 app --max-line-length=120 || true

      - name: Unit tests
        run: pytest -q || true

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate kustomize overlay
        run: kubectl kustomize k8s/overlays/dev > /dev/null

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint & template
        run: |
          helm lint helm/app
          helm template helm/app > /dev/null

  build:
    name: Build & Push Image
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest
